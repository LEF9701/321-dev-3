spring.application.name=Smart Estate

# H2 in-memory database, seeded fresh on every startup (Evergreen Bay Estate demo data)
spring.datasource.url=jdbc:h2:mem:smartestate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL above, user sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf - disable cache so template edits show immediately during the demo
spring.thymeleaf.cache=false

# File uploads (issue photos)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
app.upload-dir=${java.io.tmpdir}/smartestate-uploads

server.port=8080

# ---- FR-8 AI module ----
# Local/offline engine is always available (TF-IDF retrieval + k-NN classifier).
# Set claude.enabled=true and export ANTHROPIC_API_KEY to route the chatbot's
# answer generation through Claude instead of the extractive fallback.
app.ai.claude.enabled=true
app.ai.claude.model=claude-opus-4-8
app.ai.rag.top-k=4
app.ai.rag.threshold=0.06
app.ai.knn.k=5

# ---- Enabled notification channels ----
# Comma-separated of SMS,WHATSAPP,EMAIL,VOICE. Only these are used for dispatch and offered in the
# resident preferences UI; the rest are shown as disabled. Currently SMS-only.
app.channels.enabled=SMS

# ---- Seed data (safety / privacy) ----
# Resident personal data (names / phones / emails) is NOT seeded by default, so a public
# deployment stores NO resident PII. Set to true ONLY for a local or private demo.
app.seed.residents=false

# ---- FR-1.1 AWS notification dispatch ----
# Disabled by default -> mock/simulated delivery engine (fully offline). Set enabled=true and fill
# the identities below to route each channel to its AWS service:
#   SMS -> End User Messaging SMS | Voice -> End User Messaging Voice | Email -> SES | WhatsApp -> End User Messaging Social
# Safe repo default: OFF (mock engine). Enable per deployment via env, e.g.
#   APP_AWS_MESSAGING_ENABLED=true, APP_AWS_MESSAGING_SMS_ORIGINATIONIDENTITY=arn:aws:sms-voice:...
# plus AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. Never commit real ARNs or keys.
app.aws.messaging.enabled=false
app.aws.messaging.region=ap-southeast-1
# Record an accepted AWS send as DELIVERED (true) instead of SENT/unconfirmed (false).
# true = analytics reflect the send immediately; set false once you wire real delivery-receipt
# callbacks (SMS configuration set -> SNS event destination) to advance the status.
app.aws.messaging.assume-delivered=true
# Credentials: leave blank to use the default AWS provider chain (env vars / profile / instance role).
app.aws.messaging.access-key-id=
app.aws.messaging.secret-access-key=
# SMS (End User Messaging SMS): origination = phone-number ARN, pool id, or sender id (set via env, not committed)
app.aws.messaging.sms.origination-identity=
app.aws.messaging.sms.configuration-set=
# Voice (End User Messaging Voice)
app.aws.messaging.voice.origination-identity=
app.aws.messaging.voice.voice-id=Joanna
app.aws.messaging.voice.configuration-set=
# Email (Amazon SES): from = a verified SES identity
app.aws.messaging.email.from=
app.aws.messaging.email.configuration-set=
# WhatsApp (End User Messaging Social)
app.aws.messaging.whatsapp.origination-phone-number-id=
app.aws.messaging.whatsapp.meta-api-version=v20.0
